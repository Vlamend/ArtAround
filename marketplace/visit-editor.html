<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtAround Editor — Visita</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header>
    <strong>ArtAround Editor</strong>
  </header>

  <main>
    <p><a id="back-link" href="museums">&larr; Torna ai contenuti</a></p>

    <h1 id="page-title">Nuova visita</h1>
    <p id="status" class="status-message" hidden></p>

    <form id="visit-form">
      <label>
        Titolo
        <input type="text" id="title" required />
      </label>

      <label>
        Descrizione
        <textarea id="description" rows="2"></textarea>
      </label>

      <label>
        Indicazioni logistiche generali (ingresso, biglietto, servizi)
        <textarea id="entrance-info" rows="2"></textarea>
      </label>

      <label>
        Licenza
        <select id="license">
          <option value="CC0">CC0</option>
          <option value="CC-BY" selected>CC-BY</option>
          <option value="CC-BY-SA">CC-BY-SA</option>
          <option value="CC-BY-NC">CC-BY-NC</option>
          <option value="private">Privata</option>
        </select>
      </label>

      <label>
        Prezzo (€, 0 = gratuita)
        <input type="number" id="price" min="0" step="0.5" value="0" />
      </label>

      <label style="flex-direction: row; align-items: center; gap: 0.5rem;">
        <input type="checkbox" id="is-public" style="width: auto;" />
        Pubblica (visibile nel marketplace)
      </label>

      <label>
        Tag (separati da virgola)
        <input type="text" id="tags" placeholder="es. famiglie, curiosità" />
      </label>

      <label>
        Ritmo della visita (durata del testo generale per ogni tappa)
        <select id="pace">
          <option value="3s">Rapidissima (3s)</option>
          <option value="15s" selected>Veloce (15s)</option>
          <option value="40s">Normale (40s)</option>
          <option value="1min">Approfondita (1min)</option>
          <option value="4min">Lunga (4min)</option>
        </select>
      </label>

      <h2>Tappe della visita</h2>

      <div>
        <label>
          Cerca opere del museo
          <input type="text" id="item-search" placeholder="Titolo…" />
        </label>
      </div>

      <h3>Contenuti disponibili</h3>
      <p class="status-message">Tue opere o di cui possiedi la licenza, oppure hai la possibilità di acquisire la
        licenza di nuovi contenuti.</p>
      <div class="organizer card">
        <div class="organizer-header">
          <div id="checkboxes" class="filter-checkboxes">
            <label id="mine-check" class="filter-label">
              <span>Miei</span>
              <input type="checkbox" id="check-mine" checked>
            </label>
            <label id="others-check" class="filter-label">
              <span>Altrui</span>
              <input type="checkbox" id="check-others" checked>
            </label>
          </div>

          <div class="filter-sort">
            <label for="sort-select">Ordina per:</label>
            <select id="sort-select" class="filter-dropdown">
              <option value="property">Proprietari</option>
              <option value="title-asc">Titolo (A-Z)</option>
              <option value="title-desc">Titolo (Z-A)</option>
              <option value="newest">Più recenti</option>
            </select>
          </div>

          <div class="filter-scale">
            <label for="per-page-select">Mostra:</label>
            <select id="per-page-select" class="filter-dropdown">
              <option value="1">1</option>
              <option value="3">3</option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
        <ul id="item-results" class="card-list"></ul>
        <ul id="purchasable-results" class="card-list"></ul>

        <div class="organizer-footer">
          <div id="pagination" class="pagination"></div>
          <div id="pagination-info" class="pagination-info"></div>
        </div>
      </div>

      <h3>Sequenza attuale</h3>
      <p id="steps-empty" class="status-message">Nessuna tappa aggiunta. Cerca un'opera qui sopra.</p>
      <ul id="steps-list" class="card-list"></ul>

      <p id="form-error" class="error-message" hidden></p>

      <div style="display: flex; gap: 0.5rem;">
        <button type="submit" class="primary" id="submit-btn">Crea visita</button>
        <button type="button" class="danger" id="delete-btn" hidden>Elimina visita</button>
      </div>
    </form>
  </main>

  <script type="module" src="js/visit-editor.js"></script>
</body>

</html>
